name: Battery Catalog Sync

on:
  schedule:
    # 12:00 AM and 12:00 PM NZ time (NZST = UTC+12, so 12:00/00:00 UTC)
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      target_skus:
        description: "Comma-separated SKUs to test (leave blank for full run)"
        required: false
        default: ""
      max_products:
        description: "Limit number of products (leave blank for no limit)"
        required: false
        default: ""
      request_delay_ms:
        description: "Delay in ms between each product"
        required: false
        default: "0"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run catalog sync
        env:
          HCB_USERNAME: ${{ secrets.HCB_USERNAME }}
          HCB_PASSWORD: ${{ secrets.HCB_PASSWORD }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET_SKUS: ${{ github.event.inputs.target_skus }}
          MAX_PRODUCTS: ${{ github.event.inputs.max_products }}
          REQUEST_DELAY_MS: ${{ github.event.inputs.request_delay_ms }}
        run: node catalog-sync.js

      - name: Fetch price-loading JS source for inspection
        if: always()
        run: |
          echo "--- get_remote_price.js ---" > price-js-source.txt
          curl -s "https://hcb.co.nz/sites/all/modules/custom/koda_price_policy/js/get_remote_price.js" >> price-js-source.txt || echo "fetch failed" >> price-js-source.txt
          echo "" >> price-js-source.txt
          echo "--- koda_price_policy_alter.js ---" >> price-js-source.txt
          curl -s "https://hcb.co.nz/sites/all/modules/custom/koda_price_policy_alter/js/koda_price_policy_alter.js" >> price-js-source.txt || echo "fetch failed" >> price-js-source.txt

      - name: Report result to repo (bypasses blocked log/DB domains)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET_SKUS: ${{ github.event.inputs.target_skus }}
        run: |
          SKU="${TARGET_SKUS:-DIN66}"
          SKU_IN_LIST=$(echo "$SKU" | tr ',' '\n' | sed "s/^/\"/;s/$/\"/" | paste -sd, -)
          echo "Run at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > last-run-result.txt
          echo "Checked SKUs: $SKU" >> last-run-result.txt
          curl -s "$SUPABASE_URL/rest/v1/battery_catalog?sku=in.($SKU_IN_LIST)&select=sku,price_ex_gst,price_incl_gst,branch_stock,national_stock" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" >> last-run-result.txt
          echo "" >> last-run-result.txt
          if [ -f scrape-debug.txt ]; then
            echo "--- scrape-debug.txt ---" >> last-run-result.txt
            cat scrape-debug.txt >> last-run-result.txt
          fi
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add last-run-result.txt price-js-source.txt category-listing.json
          git commit -m "Result: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          git push
